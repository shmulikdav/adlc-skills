name: Release

# When the newest "## vX.Y.Z" heading in CHANGELOG.md has no tag yet,
# verify versions and tests, then tag it and publish a GitHub Release with that section as notes.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version from CHANGELOG
        id: v
        run: |
          ver=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/## //')
          echo "tag=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse "$ver" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify
        if: steps.v.outputs.exists == 'false'
        run: |
          python validate_plugins.py
          python -m unittest discover -s tests
      - name: Extract notes
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v tag="${{ steps.v.outputs.tag }}" '
            $0 ~ "^## "tag {grab=1; next}
            grab && /^## v/ {exit}
            grab {print}' CHANGELOG.md > notes.md
      - name: Tag and release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" --title "ADLC Skills ${{ steps.v.outputs.tag }}" --notes-file notes.md --target "${{ github.sha }}"
