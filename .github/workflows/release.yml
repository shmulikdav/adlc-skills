name: Release

# When the newest "## vX.Y.Z" heading in CHANGELOG.md has no tag yet,
# verify versions and tests (read-only job), then tag it and publish a GitHub Release
# with that section as notes (write job, runs only if verification passed).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Read version from CHANGELOG
        id: v
        run: |
          ver=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/## //')
          echo "tag=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse "$ver" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify
        if: steps.v.outputs.exists == 'false'
        run: |
          python validate_plugins.py
          python -m unittest discover -s tests
      - name: Eval evidence for this release
        if: steps.v.outputs.exists == 'false'
        run: |
          ver="${{ steps.v.outputs.tag }}"
          awk -v tag="$ver" '$0 ~ "^## "tag {grab=1; next} grab && /^## v/ {exit} grab {print}' CHANGELOG.md > notes.md
          if grep -qiE "skills?/|skill content|description|workflow" notes.md && ! grep -qi "evals:" notes.md; then
            echo "::warning::This release changes skill behavior but its CHANGELOG section has no 'Evals:' line. Run claude plugin eval on the changed plugins and record the result."
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Extract notes
        run: |
          awk -v tag="${{ needs.verify.outputs.tag }}" '
            $0 ~ "^## "tag {grab=1; next}
            grab && /^## v/ {exit}
            grab {print}' CHANGELOG.md > notes.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.verify.outputs.tag }}" --title "ADLC Skills ${{ needs.verify.outputs.tag }}" --notes-file notes.md --target "${{ github.sha }}"
