name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Manifests are in sync
        run: |
          python scripts/sync_manifests.py
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "Generated files are out of date. Run: python3 scripts/sync_manifests.py"; exit 1; fi
      - name: Plugin validator
        run: python validate_plugins.py
      - name: Consistency tests
        run: python -m unittest discover -s tests -v
